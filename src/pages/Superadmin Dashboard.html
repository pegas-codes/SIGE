<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F8FAFC; color: #1E293B; }
        .dashboard-card { background: white; border: 1px solid #E2E8F0; border-radius: 16px; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: #EFF6FF; color: #1D4ED8; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 bg-white border-r border-slate-200 p-6 flex flex-col">
        <div class="mb-10 text-xl font-black text-blue-900 tracking-tighter">SIGE-UC App</div>
        <nav class="space-y-2 flex-grow">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Pages</div>
            <a class="sidebar-item block p-3 rounded-xl bg-blue-50 text-blue-700 font-medium">Tableau de bord</a>
            <a class="sidebar-item block p-3 rounded-xl text-slate-600">Utilisateurs</a>
            <a class="sidebar-item block p-3 rounded-xl text-slate-600">Etablissements</a>
            <a class="sidebar-item block p-3 rounded-xl text-slate-600">Formations</a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Tableau de bord</h1>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium shadow-lg shadow-blue-200">Voir profil</button>
        </header>

        <div class="grid grid-cols-4 gap-6 mb-8">
            <div class="dashboard-card p-6">
                <div class="text-slate-400 text-sm font-medium mb-1">Étudiants</div>
                <div class="text-3xl font-bold mb-2">12,897</div>
                <div class="text-emerald-500 text-xs font-bold">↑ 18.6% <span class="text-slate-400 font-normal">vs mois dernier</span></div>
            </div>
            <div class="dashboard-card p-6"><div class="text-slate-400 text-sm">Universités</div><div class="text-3xl font-bold">23,456</div></div>
            <div class="dashboard-card p-6"><div class="text-slate-400 text-sm">Formations</div><div class="text-3xl font-bold">1,254</div></div>
            <div class="dashboard-card p-6"><div class="text-slate-400 text-sm">Événements</div><div class="text-3xl font-bold">10</div></div>
        </div>

        <div class="grid grid-cols-3 gap-6">
            <div class="col-span-2 dashboard-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg">Utilisateurs récents</h3>
                    <button class="text-blue-600 text-sm font-semibold">Voir tous les utilisateurs</button>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-50 pb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-slate-200"></div>
                            <div>
                                <div class="font-bold text-sm">Mounanga Stella</div>
                                <div class="text-xs text-slate-400">lucien38@sige-uc.com</div>
                            </div>
                        </div>
                        <span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-xs font-bold">Actif</span>
                    </div>
                </div>
            </div>

            <div class="dashboard-card p-6">
                <h3 class="font-bold text-lg mb-6">Actions Rapides</h3>
                <div class="space-y-3">
                    <button class="w-full text-left p-3 border border-slate-100 rounded-xl hover:bg-slate-50 font-medium text-sm flex justify-between">Ajouter un étudiant <span>→</span></button>
                    <button class="w-full text-left p-3 border border-slate-100 rounded-xl hover:bg-slate-50 font-medium text-sm flex justify-between">Ajouter une université <span>→</span></button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
